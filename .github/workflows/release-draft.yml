name: Draft Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: draft-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android API 36
        shell: bash
        run: |
          SDK_ROOT="/usr/local/lib/android/sdk"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Quality gates and APK
        run: ./gradlew --no-daemon lintDebug assembleDebug

      - name: Prepare release assets
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/SX-Dynamic-v${VERSION}-debug.apk"
          cd dist
          sha256sum "SX-Dynamic-v${VERSION}-debug.apk" > "SX-Dynamic-v${VERSION}-debug.apk.sha256"

      - name: Create or refresh draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate)"
          RELEASE_ID="$(printf '%s' "$RELEASE_JSON" | jq -r --arg tag "$TAG" '.[] | select(.tag_name == $tag) | .id' | head -1)"
          IS_DRAFT="$(printf '%s' "$RELEASE_JSON" | jq -r --arg tag "$TAG" '.[] | select(.tag_name == $tag) | .draft' | head -1)"

          if [ -n "$RELEASE_ID" ] && [ "$IS_DRAFT" = "false" ]; then
            echo "Release $TAG is already published. Leaving it unchanged."
            exit 0
          fi

          if [ -n "$RELEASE_ID" ]; then
            gh release upload "$TAG" dist/* --clobber
            gh api               --method PATCH               "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}"               -f name="SX Dynamic v${VERSION}"               -F draft=true >/dev/null
            echo "Draft release $TAG refreshed."
          else
            gh release create "$TAG" dist/*               --target "$GITHUB_SHA"               --title "SX Dynamic v${VERSION}"               --draft               --generate-notes
            echo "Draft release $TAG created."
          fi
